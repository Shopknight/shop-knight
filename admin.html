<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Knight | Admin</title>
<style>
body{margin:0;font-family:Tahoma,Arial;background:#09090d;color:#fff}.wrap{max-width:1200px;margin:auto;padding:20px}
h1{color:#f4c542}.card{background:#15151d;border:1px solid #292936;border-radius:16px;padding:16px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:18px;background:#111118;border-radius:12px}.num{font-size:25px;color:#f4c542;font-weight:bold}
input,button{padding:11px;border-radius:9px;border:1px solid #393944;background:#0f0f15;color:#fff;margin:4px}button{cursor:pointer;background:#f4c542;color:#111;font-weight:bold}
button.danger{background:#ff7373}.receipt{background:#69e18d;color:#111}
table{width:100%;border-collapse:collapse;margin-top:12px;display:block;overflow-x:auto}th,td{padding:10px;border-bottom:1px solid #292936;text-align:right;white-space:nowrap}
.pending{color:#f4c542}.done{color:#69e18d}.rejected{color:#ff7373}.note{color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>🛡️ Shop Knight — پنل مدیریت</h1>

<div id="login" class="card">
<h3>ورود مدیر</h3>
<input id="pw" type="password" placeholder="رمز ورود">
<button onclick="login()">ورود</button>
<p class="note">پنل مدیریت Shop Knight</p>
</div>

<div id="panel" style="display:none">
<div class="stats">
<div class="stat">کل سفارش‌ها<div id="total" class="num">0</div></div>
<div class="stat">در انتظار<div id="pending" class="num">0</div></div>
<div class="stat">تأییدشده<div id="done" class="num">0</div></div>
<div class="stat">ردشده<div id="rejected" class="num">0</div></div>
</div>

<div class="card">
<input id="search" placeholder="جستجو بر اساس ID یا کد سفارش" oninput="render()">
<button onclick="loadOrders()">🔄 بروزرسانی</button>
<table>
<thead><tr>
<th>کد</th><th>ID بازی</th><th>سکه</th><th>مبلغ</th><th>وضعیت</th><th>رسید</th><th>عملیات</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://htwtlxnvozlxtwqvycxp.supabase.co";
const SUPABASE_KEY="sb_publishable_y8D2hzgAq-PEihWY-9qDmg_Xoj2A30o";

let orders=[];

function login(){
  if(document.getElementById("pw").value==="1234"){
    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="block";
    loadOrders();
  }else alert("رمز اشتباه است");
}

async function loadOrders(){
  const rows=document.getElementById("rows");
  rows.innerHTML='<tr><td colspan="7">⏳ در حال دریافت سفارش‌ها...</td></tr>';
  try{
    const res=await fetch(
      SUPABASE_URL+"/rest/v1/orders?select=*&order=id.desc",
      {headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}}
    );
    if(!res.ok) throw new Error(await res.text());
    orders=await res.json();
    render();
  }catch(e){
    rows.innerHTML='<tr><td colspan="7">❌ خطا در دریافت سفارش‌ها</td></tr>';
    console.error(e);
  }
}

function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const filtered=orders.filter(o =>
    String(o.id||"").toLowerCase().includes(q) ||
    String(o.player_id||"").toLowerCase().includes(q)
  );

  document.getElementById("total").textContent=orders.length;
  document.getElementById("pending").textContent=orders.filter(o=>o.status==="در انتظار").length;
  document.getElementById("done").textContent=orders.filter(o=>o.status==="تأیید شده").length;
  document.getElementById("rejected").textContent=orders.filter(o=>o.status==="رد شده").length;

  document.getElementById("rows").innerHTML=filtered.map(o=>{
    const id=encodeURIComponent(o.id);
    const statusClass=o.status==="تأیید شده"?"done":o.status==="رد شده"?"rejected":"pending";
    const receipt=o.receipt_path
      ? `<button class="receipt" onclick="viewReceipt('${id}')">🧾 رسید</button>`
      : "—";

    return `<tr>
      <td>${escapeHtml(o.id)}</td>
      <td>${escapeHtml(o.player_id)}</td>
      <td>${escapeHtml(o.coins)}</td>
      <td>${escapeHtml(o.price)} تومان</td>
      <td class="${statusClass}">${escapeHtml(o.status)}</td>
      <td>${receipt}</td>
      <td>
        <button onclick="setStatus('${id}','در انتظار')">انتظار</button>
        <button onclick="setStatus('${id}','تأیید شده')">تأیید</button>
        <button onclick="setStatus('${id}','رد شده')">رد</button>
        <button class="danger" onclick="deleteOrder('${id}')">حذف</button>
      </td>
    </tr>`;
  }).join("") || '<tr><td colspan="7">سفارشی وجود ندارد.</td></tr>';
}

async function setStatus(encodedId,status){
  const id=decodeURIComponent(encodedId);
  try{
    const res=await fetch(
      SUPABASE_URL+"/rest/v1/orders?id=eq."+encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json",
          Prefer:"return=minimal"
        },
        body:JSON.stringify({status:status})
      }
    );
    if(!res.ok) throw new Error(await res.text());
    await loadOrders();
  }catch(e){
    alert("تغییر وضعیت انجام نشد.");
    console.error(e);
  }
}

async function deleteOrder(encodedId){
  const id=decodeURIComponent(encodedId);
  if(!confirm("این سفارش و اطلاعات آن از جدول سفارش‌ها حذف شود؟")) return;

  try{
    const order=orders.find(o=>String(o.id)===String(id));

    const res=await fetch(
      SUPABASE_URL+"/rest/v1/orders?id=eq."+encodeURIComponent(id),
      {
        method:"DELETE",
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer "+SUPABASE_KEY,
          Prefer:"return=minimal"
        }
      }
    );
    if(!res.ok) throw new Error(await res.text());

    if(order && order.receipt_path){
      await fetch(
        SUPABASE_URL+"/storage/v1/object/receipts/"+order.receipt_path.split("/").map(encodeURIComponent).join("/"),
        {
          method:"DELETE",
          headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}
        }
      );
    }

    await loadOrders();
  }catch(e){
    alert("حذف انجام نشد. احتمالاً دسترسی حذف در Supabase فعال نیست.");
    console.error(e);
  }
}

async function viewReceipt(encodedId){
  const id=decodeURIComponent(encodedId);
  const order=orders.find(o=>String(o.id)===String(id));
  if(!order || !order.receipt_path) return alert("رسیدی برای این سفارش پیدا نشد.");

  try{
    const res=await fetch(
      SUPABASE_URL+"/storage/v1/object/sign/receipts/"+order.receipt_path,
      {
        method:"POST",
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({expiresIn:3600})
      }
    );
    if(!res.ok) throw new Error(await res.text());
    const data=await res.json();
    const url=SUPABASE_URL+"/storage/v1"+data.signedURL;
    window.open(url,"_blank");
  }catch(e){
    alert("باز کردن رسید انجام نشد.");
    console.error(e);
  }
}

function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}
</script>
</body>
</html>
